name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # On main every push gets its own verdict (a group per SHA, so nothing waits or
  # is replaced): a deploy names the exact SHA it ships, which needs that SHA's
  # own run. Elsewhere a newer push cancels the run in progress.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm gen

      - name: Generated contract matches the committed one
        run: git diff --exit-code -- packages/contracts

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Guards
        run: pnpm guards

      - name: Unit and architecture tests
        run: pnpm test

      - name: Workers tests (workerd)
        run: pnpm test:pool

      - name: Deploy dry-run
        run: pnpm deploy:dry
