# forge-lite is a standalone package outside the repository's pnpm workspace.
# This file makes it a workspace root of its own, so pnpm never walks up to the
# parent workspace (or installs its dependencies) when running scripts here.
packages:
  - "."

# Running a script never installs anything. scenarios/worlds.sh and
# scenarios/cold-open.sh run scripts in throwaway copies whose node_modules is
# a symlink back to this one, and must not write through it.
verifyDepsBeforeRun: false
