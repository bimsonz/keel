packages:
  - apps/*
  - packages/*
  - examples/*
  - e2e
  # fixtures/ and spikes/ are deliberately outside the workspace: each carries
  # its own package.json and lockfile.
  - "!fixtures/**"
  - "!spikes/**"

allowBuilds:
  esbuild: true
  workerd: true
  # Their install script builds a native addon (node-gyp-build); only the prebuilt .wasm grammar is used.
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  # Pulled in by Flue's model providers (examples/swarm); none of their install scripts is needed on Workers.
  "@google/genai": false
  core-js-pure: false
  protobufjs: false

# Every third-party version used anywhere in the workspace is pinned here, once.
# Packages refer to these with `catalog:`. Read the registry (`pnpm view`) before
# changing a pin; never guess a version.
catalog:
  # Toolchain
  typescript: 7.0.2
  "@types/node": 22.20.5
  oxlint: 1.87.0
  oxfmt: 0.72.0
  oxlint-tsgolint: 7.0.2004
  vitest: 5.0.3
  "@cloudflare/vitest-plugin": 1.4.0
  # Tier 2: @cloudflare/ci runs on the sandbox's 0.x Sandbox class. Its 0.2.0 pins
  # sandbox 0.12.1; the override below holds it to this one, the newest 0.x, which
  # keel-verify's image runs the server of (containers/sandbox/Dockerfile).
  "@cloudflare/ci": 0.2.0
  "@cloudflare/sandbox": 0.12.10
  wrangler: 4.149.0
  "@cloudflare/workers-types": 5.20261010.1
  # Tier 1: bundles a probe over a world inside the VerifierDO (esbuild-wasm); it never installs.
  "@cloudflare/worker-bundler": 0.2.6
  fast-check: 4.10.2
  # Test-only: the domain machines' XState-format charts; never a runtime (guard xstate-test-only).
  xstate: 5.33.2

  # Architecture rules and guards
  archunit: 2.5.4
  oxc-parser: 0.153.0
  jsonc-parser: 3.3.1

  # Runtime
  # effect and @effect/vitest move together, as a matching pair.
  effect: 4.0.2
  "@effect/vitest": 4.0.2
  hono: 4.13.13
  # examples/swarm: Flue's agent harness, built for Workers by the vite and
  # @cloudflare/vite-plugin pins below (the plugin's wrangler peer takes the pin above).
  "@flue/runtime": 2.3.0
  "@flue/vite": 2.3.0
  # Flue's schemas for a tool's input and an agent's creation data.
  valibot: 1.5.0
  "@hono/zod-validator": 0.9.1
  zod: 4.6.5
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/client": 2.3.1
  jose: 6.2.12
  ulid: 3.0.2
  diff: 9.0.0
  isomorphic-git: 1.43.3
  # The parser behind SyntaxSource: the runtime and its TypeScript grammar, both shipped as Wasm. They move together.
  web-tree-sitter: 0.27.1
  tree-sitter-typescript: 0.23.2

  # API first
  "@typespec/compiler": 1.17.0
  "@typespec/http": 1.17.0
  "@typespec/openapi": 1.17.0
  "@typespec/openapi3": 1.17.0
  "@typespec/json-schema": 1.17.0
  typespec-hono: 0.24.0
  typespec-http-mcp: 0.1.0
  typespec-openapi-document: 0.5.0
  ajv: 8.20.0
  ajv-formats: 3.0.1

  # Console
  react: 19.3.0
  "@tanstack/react-query": 5.104.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  "@cloudflare/vite-plugin": 1.63.1
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@cloudflare/kumo": 2.14.0
  "@phosphor-icons/react": 2.1.10
  "@pierre/diffs": 1.5.2
  "@xyflow/react": 12.12.0
  uqr: 0.1.3
  # A README, and the console's own terms and notice, drawn as elements: no raw HTML is ever rendered.
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  rehype-slug: 6.0.0
  # Identity: Keel's users, sessions, orgs and device grant, and the console's client for them. They move together.
  better-auth: 1.7.7
  "@better-auth/passkey": 1.7.7
  # The authorization server for agents: signed token requests, key-bound tokens, the published key.
  "@better-auth/oauth-provider": 1.7.7
  # The console's browser checks (apps/console/scripts): run by hand, never in CI.
  playwright: 1.64.0

# One sandbox SDK in the workspace: the one the image's server matches.
overrides:
  "@cloudflare/ci>@cloudflare/sandbox": "catalog:"

minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/darwin-arm64@7.0.2004"
  - "@oxlint-tsgolint/darwin-x64@7.0.2004"
  - "@oxlint-tsgolint/linux-arm64@7.0.2004"
  - "@oxlint-tsgolint/linux-x64@7.0.2004"
  - "@oxlint-tsgolint/win32-arm64@7.0.2004"
  - "@oxlint-tsgolint/win32-x64@7.0.2004"
  - oxlint-tsgolint@7.0.2004
  - "@bimsonz/mfp@0.2.1"
